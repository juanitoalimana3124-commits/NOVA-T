<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
  </defs>

  <!-- Top horizontal bar (cyan) -->
  <rect x="20" y="18" width="80" height="7" rx="3.5" fill="url(#topGrad)"/>

  <!-- Second bar shorter -->
  <rect x="28" y="30" width="64" height="5" rx="2.5" fill="url(#topGrad)" opacity="0.85"/>

  <!-- Vertical candlestick bars -->
  <!-- Bar 1 (left tall) -->
  <rect x="28" y="38" width="10" height="48" rx="2" fill="url(#barGrad)"/>
  <!-- Bar 1 wick top -->
  <rect x="32" y="30" width="2" height="10" rx="1" fill="#00D4FF"/>

  <!-- Bar 2 -->
  <rect x="43" y="50" width="10" height="36" rx="2" fill="url(#barGrad)"/>
  <!-- Bar 2 wick -->
  <rect x="47" y="38" width="2" height="14" rx="1" fill="#0099CC"/>

  <!-- Bar 3 (center tall) -->
  <rect x="58" y="40" width="10" height="46" rx="2" fill="url(#barGrad)"/>
  <!-- Bar 3 wick -->
  <rect x="62" y="30" width="2" height="12" rx="1" fill="#00AADD"/>

  <!-- Bar 4 -->
  <rect x="73" y="52" width="10" height="34" rx="2" fill="url(#barGrad)"/>
  <!-- Bar 4 wick -->
  <rect x="77" y="40" width="2" height="14" rx="1" fill="#0077BB"/>

  <!-- Upward arrow line -->
  <line x1="22" y1="88" x2="90" y2="32" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="90,32 78,34 88,44" fill="#FACC15"/>
</svg>
